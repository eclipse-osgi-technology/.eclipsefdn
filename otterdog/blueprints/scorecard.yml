id: osgi-tech-scorecard
name: OSSF Scorecard analysis
description: |-
  Adds .github/workflows/scorecard-analysis.yml, which calls the reusable
  Scorecard workflow of eclipse-osgi-technology/.github.
type: required_file
config:
  repo_selector:
    name_pattern:
      - '\.github'
      - 'command'
      - 'console'
      - 'container\.feature-launcher'
      - 'feature-launcher'
      - 'features'
      - 'incubator'
      - 'jakarta-webservices'
      - 'janus'
      - 'maven-pom'
      - 'opentelemetry'
      - 'osgi-build-tools'
      - 'osgi-test'
      - 'plurl'
      - 'scheduler'
  files:
    - path: .github/workflows/scorecard-analysis.yml
      content: |
        # Managed by the otterdog blueprint
        # {{blueprint_url}}
        # change it there; the logic lives in eclipse-osgi-technology/.github.
        name: Scorecard analysis
        on:
          branch_protection_rule:
          schedule:
            - cron: '43 5 * * 2'
          push:
            branches: [ main ]
        permissions: read-all
        jobs:
          analysis:
            permissions:
              security-events: write
              id-token: write
            uses: eclipse-osgi-technology/.github/.github/workflows/scorecard.yml@main
      strict: true
